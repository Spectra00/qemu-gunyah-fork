name: Build QEMU-Gunyah (Android arm64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl git make ninja-build patchelf perl pkg-config python3 python3-pip tar
          pip3 install --user "meson>=1.4.0"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30-beta2

      - name: Prepare dummy alsDir (script requires it, we only need the standalone output)
        run: mkdir -p /tmp/als-dummy/app/src/main/jniLibs/arm64-v8a

      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          alsDir: /tmp/als-dummy
        run: ./build.sh

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-gunyah-arm64
          path: build/out/qemu-gunyah/
